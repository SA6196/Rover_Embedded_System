<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Animated banner: Border Surveillance Rover" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#1a2a44"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4fc3f7" stop-opacity=".6"/><stop offset="1" stop-color="#4fc3f7" stop-opacity="0"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
text{font-family:Segoe UI,Arial,sans-serif}
.rover{animation:drive 10s linear infinite}
.w{transform-box:fill-box;transform-origin:center;animation:spin .7s linear infinite}
.beam{animation:sweep 3s ease-in-out infinite}
.rec{animation:blink 1s steps(2) infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
.star{animation:blink 3s ease-in-out infinite}
.sub{animation:fade 4s ease-in-out infinite}
@keyframes drive{from{transform:translateX(-160px)}to{transform:translateX(1000px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sweep{0%,100%{transform:rotate(-38deg)}50%{transform:rotate(30deg)}}
@keyframes blink{50%{opacity:.15}}
@keyframes pulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.4);opacity:0}}
@keyframes fade{50%{opacity:.55}}
</style>
<rect width="900" height="260" fill="url(#bg)"/>
<g fill="#fff">
<circle class="star" cx="60" cy="28" r="1.6"/><circle class="star" cx="210" cy="50" r="1.2" style="animation-delay:.8s"/>
<circle class="star" cx="380" cy="22" r="1.5" style="animation-delay:1.5s"/><circle class="star" cx="640" cy="36" r="1.4" style="animation-delay:.4s"/>
<circle class="star" cx="780" cy="20" r="1.7" style="animation-delay:2s"/><circle class="star" cx="850" cy="58" r="1.2" style="animation-delay:1.1s"/>
</g>
<rect y="232" width="900" height="28" fill="#0d1626"/>
<line x1="0" y1="232" x2="900" y2="232" stroke="#2c4166" stroke-width="2"/>
<path d="M0 172H900M0 192H900" stroke="#3a5382" stroke-width="1.2"/>
<path d="M30 156V232M120 156V232M210 156V232M300 156V232M390 156V232M480 156V232M570 156V232M660 156V232M750 156V232M840 156V232" stroke="#2c4166" stroke-width="3"/>
<text x="450" y="78" text-anchor="middle" font-size="44" font-weight="800" fill="#fff" letter-spacing="4" filter="url(#glow)">BORDER SURVEILLANCE ROVER</text>
<text class="sub" x="450" y="112" text-anchor="middle" font-size="16" fill="#ff9800" letter-spacing="3">ESP32 · WiFi · RADAR · GPS · IMU · LIVE VIDEO</text>
<g class="rover">
<rect x="0" y="198" width="112" height="26" rx="6" fill="#26385a" stroke="#4fc3f7" stroke-width="1.5"/>
<rect x="10" y="204" width="40" height="8" rx="2" fill="#4fc3f7" opacity=".5"/>
<circle class="ring" cx="92" cy="198" r="10" fill="none" stroke="#4caf50" stroke-width="2"/>
<circle cx="92" cy="198" r="3" fill="#4caf50"/>
<line x1="56" y1="198" x2="56" y2="177" stroke="#9fb3d1" stroke-width="3"/>
<rect x="44" y="162" width="26" height="15" rx="3" fill="#1b2a47" stroke="#ff9800"/>
<circle class="rec" cx="50" cy="169" r="3" fill="#f44336"/>
<g transform="translate(70,169)"><path class="beam" d="M0 0L150-46L150 46Z" fill="url(#beam)"/></g>
<g fill="#0d1626" stroke="#9fb3d1" stroke-width="2">
<g class="w"><circle cx="18" cy="224" r="11"/><path d="M18 213V235M7 224H29"/></g>
<g class="w"><circle cx="56" cy="224" r="11"/><path d="M56 213V235M45 224H67"/></g>
<g class="w"><circle cx="94" cy="224" r="11"/><path d="M94 213V235M83 224H105"/></g>
</g>
</g>
</svg>
